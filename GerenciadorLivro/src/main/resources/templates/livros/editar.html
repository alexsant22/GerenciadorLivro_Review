<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Livro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h2 class="text-center">Editar Livro</h2>
                </div>
                <div class="card-body">
                    <form th:action="@{/livros/editar/{id}(id=${livro.id})}" th:object="${livro}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="titulo" class="form-label">Título *</label>
                            <input type="text" class="form-control" id="titulo" th:field="*{titulo}"
                                   required maxlength="255">
                            <div class="form-text text-danger" th:if="${#fields.hasErrors('titulo')}"
                                 th:errors="*{titulo}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="autor" class="form-label">Autor *</label>
                            <input type="text" class="form-control" id="autor" th:field="*{autor}"
                                   required maxlength="255">
                            <div class="form-text text-danger" th:if="${#fields.hasErrors('autor')}"
                                 th:errors="*{autor}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="editora" class="form-label">Editora</label>
                            <input type="text" class="form-control" id="editora" th:field="*{editora}"
                                   maxlength="255">
                            <div class="form-text text-danger" th:if="${#fields.hasErrors('editora')}"
                                 th:errors="*{editora}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="anoPublicacao" class="form-label">Ano de Publicação</label>
                            <input type="number" class="form-control" id="anoPublicacao" th:field="*{anoPublicacao}"
                                   min="1000" max="2024">
                            <div class="form-text text-danger" th:if="${#fields.hasErrors('anoPublicacao')}"
                                 th:errors="*{anoPublicacao}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="preco" class="form-label">Preço *</label>
                            <input type="number" step="0.01" class="form-control" id="preco" th:field="*{preco}"
                                   required min="0">
                            <div class="form-text text-danger" th:if="${#fields.hasErrors('preco')}"
                                 th:errors="*{preco}"></div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/livros/buscar}" class="btn btn-secondary me-md-2">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Atualizar Livro</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
